route:
  receiver: default
  group_by: [alertname, service_name]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: on-call

receivers:
  # Replace these with Slack, Microsoft Teams, PagerDuty or email.
  - name: default
  - name: on-call
